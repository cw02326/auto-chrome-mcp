# 태그 하나로 npm 발행 + GitHub 릴리스까지 끝낸다.
#
# npm 인증은 **Trusted Publishing(OIDC)** 을 쓴다 — 토큰이 필요 없고 OTP 왕복도 없다.
# 2026-08-23 실측: Bypass 2FA 토큰으로는 더 이상 발행이 안 된다(EOTP). 그래서 이 경로로 옮겼다.
#
# 사전 설정 (npmjs.com, 패키지마다 1회):
#   패키지 페이지 → Settings → Trusted publisher → GitHub Actions
#     Organization or user: cw02326
#     Repository:           auto-chrome-mcp
#     Workflow filename:    release.yml      ← 이 파일 이름과 정확히 일치해야 한다(대소문자 포함)
#     Environment:          (비움)
#     Allowed actions:      npm publish
#   대상: auto-chrome-mcp-shared, auto-chrome-mcp-bridge 두 개 모두.
name: release

on:
  push:
    tags:
      - 'v*'
  # 수동 실행 = 리허설. 빌드·테스트·팩·가드까지 다 돌리고 **발행과 릴리스는 건너뛴다**.
  # 태그를 밀기 전에 파이프라인이 성한지 확인하는 용도다.
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest # OIDC 는 GitHub 호스티드 러너에서만 동작한다 (self-hosted 미지원)
    permissions:
      contents: write # GitHub 릴리스 생성
      id-token: write # OIDC 토큰 발급 — trusted publishing 에 필수
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: '22' # trusted publishing 요구: Node >= 22.14.0
          cache: pnpm
          registry-url: https://registry.npmjs.org/

      # Node 22 번들 npm 은 10.x 라 OIDC 를 모른다. 11.5.1 이상이 필요하다.
      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      # 태그 실행이면 태그와 package.json 이 어긋난 채로 발행되는 사고를 막고,
      # 수동 실행(dry run)이면 package.json 버전을 그대로 쓴다.
      - name: Resolve and verify version
        run: |
          PKG_VERSION=$(node -p "require('./packages/shared/package.json').version")
          BRIDGE_VERSION=$(node -p "require('./app/native-server/package.json').version")
          if [ "$PKG_VERSION" != "$BRIDGE_VERSION" ]; then
            echo "::error::shared($PKG_VERSION) 와 bridge($BRIDGE_VERSION) 버전이 다릅니다"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "::error::package.json 은 $PKG_VERSION 인데 태그는 $TAG_VERSION 입니다"
              exit 1
            fi
          fi
          echo "VERSION=$PKG_VERSION" >> "$GITHUB_ENV"
          echo "검증 통과: $PKG_VERSION"

      # 스크립트를 켠 채로 설치한다. sharp 0.32 는 install 스크립트로 prebuilt 바이너리를
      # 받아오는데, --ignore-scripts 로 막으면 테스트 10개 파일이 로드조차 못 한다
      # (`Cannot find module '../build/Release/sharp-linux-x64.node'`).
      # bridge 의 postinstall 은 `dist/scripts/postinstall.js` 가 있을 때만 도는데 이 시점엔
      # dist 를 아직 빌드하지 않았으므로 no-op 이다 — CI 러너에 네이티브 호스트를 등록하지 않는다.
      - run: pnpm install --frozen-lockfile

      - name: Build all workspace packages
        run: pnpm build

      - name: Jest regression
        working-directory: app/native-server
        run: npx jest --colors

      - name: Vitest regression
        working-directory: app/chrome-extension
        run: npx vitest run

      # 에셋 이름 두 가지가 **모두** 필요하다:
      #   - install.ps1 은 릴리스 에셋에서 `*chrome.zip` 패턴으로 찾는다
      #   - bridge 의 postinstall 은 releases/latest/download/auto-chrome-mcp-extension.zip 고정명으로 받는다
      - name: Package extension zips
        run: |
          cd app/chrome-extension/.output/chrome-mv3
          zip -qr "${{ github.workspace }}/auto-chrome-mcp-extension-${VERSION}-chrome.zip" .
          cp "${{ github.workspace }}/auto-chrome-mcp-extension-${VERSION}-chrome.zip" \
             "${{ github.workspace }}/auto-chrome-mcp-extension.zip"

      - name: Package launcher tarball
        run: |
          tar czf "chrome-launcher-v${VERSION}.tar.gz" \
            -C packages/chrome-launcher \
            bin dist package.json README.md

      # ⚠️ 반드시 pnpm pack 이어야 한다. npm pack 은 내부 의존성을 "workspace:*" 그대로 남겨
      #    설치 시 EUNSUPPORTEDPROTOCOL 로 깨진다 (v1.4.0/1.4.1 이 그래서 deprecate 됐다).
      - name: Pack tarballs with resolved workspace deps
        run: |
          mkdir -p dist-tarballs
          pnpm --filter auto-chrome-mcp-shared pack --pack-destination "$PWD/dist-tarballs"
          pnpm --filter auto-chrome-mcp-bridge pack --pack-destination "$PWD/dist-tarballs"
          ls -la dist-tarballs
          # 치환이 실제로 됐는지 확인 — 안 됐으면 여기서 멈춘다.
          tar -xzOf "dist-tarballs/auto-chrome-mcp-bridge-${VERSION}.tgz" package/package.json \
            | node -e '
              let d = "";
              process.stdin.on("data", (c) => (d += c)).on("end", () => {
                const dep = JSON.parse(d).dependencies["auto-chrome-mcp-shared"];
                if (String(dep).startsWith("workspace:")) {
                  console.error("::error::workspace 의존성이 치환되지 않았습니다: " + dep);
                  process.exit(1);
                }
                console.log("bridge → shared 의존성:", dep);
              });'

      # 여기서 토큰을 쓰지 않는다. OIDC 로 인증하고 provenance 도 자동으로 붙는다.
      #
      # ⚠️ 경로 앞의 `./` 를 지우지 마라. npm 12 부터 git 타입 fetch 가 기본 차단(EALLOWGIT)이고,
      #    `dist-tarballs/foo.tgz` 처럼 슬래시가 든 인자는 로컬 파일이 아니라 `owner/repo` GitHub
      #    단축 표기로 해석된다. v1.7.0 첫 발행이 정확히 이걸로 죽었다:
      #      npm error Refusing to fetch "github:dist-tarballs/auto-chrome-mcp-shared-1.7.0.tgz"
      #    `./` 를 붙이면 파일 경로로 확정되고 npm 11·12 양쪽에서 동작한다.
      - name: Publish to npm (trusted publishing)
        if: github.event_name == 'push'
        run: |
          npm publish "./dist-tarballs/auto-chrome-mcp-shared-${VERSION}.tgz" --access public
          npm publish "./dist-tarballs/auto-chrome-mcp-bridge-${VERSION}.tgz" --access public

      - name: GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            auto-chrome-mcp-extension-${{ env.VERSION }}-chrome.zip
            auto-chrome-mcp-extension.zip
            chrome-launcher-v${{ env.VERSION }}.tar.gz
            dist-tarballs/auto-chrome-mcp-bridge-${{ env.VERSION }}.tgz
