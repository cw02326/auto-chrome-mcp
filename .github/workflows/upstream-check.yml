name: upstream-check

# 매주 화요일 00:00 UTC 에 upstream master 와 diff 검사.
# 우리가 cherry-pick 한 7 PR (#346, #338, #312, #302, #304, #329, #313) 중
# upstream 에 머지된 게 있으면 retire issue 자동 생성.
on:
  schedule:
    - cron: '0 0 * * 2'
  workflow_dispatch:

jobs:
  diff:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/hangwin/mcp-chrome.git || true
          git fetch upstream master

      - name: Diff baseline vs current upstream
        id: diff
        run: |
          BASELINE=$(grep -oE 'Baseline commit\*\*: \`[a-f0-9]+' UPSTREAM_DIFF.md | head -1 | grep -oE '[a-f0-9]+$' || true)
          CURRENT=$(git rev-parse upstream/master)
          echo "baseline=${BASELINE}" >> "$GITHUB_OUTPUT"
          echo "current=${CURRENT}" >> "$GITHUB_OUTPUT"
          echo ""
          echo "## Upstream diff since baseline (${BASELINE} → ${CURRENT})"
          if [ -n "$BASELINE" ] && [ "$BASELINE" != "$CURRENT" ]; then
            git log --oneline "${BASELINE}..upstream/master" | head -100 > upstream-diff.log
            wc -l upstream-diff.log
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect retired cherry-picks
        if: steps.diff.outputs.drift == 'true'
        id: retire
        run: |
          RETIRED=""
          for pr in 346 338 312 302 304 329 313; do
            if git log "${{ steps.diff.outputs.baseline }}..upstream/master" --grep "#${pr}\|PR-${pr}" --oneline | head -1 | grep -q .; then
              RETIRED="${RETIRED} #${pr}"
            fi
          done
          echo "retired=${RETIRED}" >> "$GITHUB_OUTPUT"

      - name: Create retire issue
        if: steps.retire.outputs.retired != ''
        uses: actions/github-script@v7
        with:
          script: |
            const retired = '${{ steps.retire.outputs.retired }}'.trim();
            const current = '${{ steps.diff.outputs.current }}';
            const baseline = '${{ steps.diff.outputs.baseline }}';
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `[upstream-sync] Retire candidates: ${retired}`,
              body: `Upstream master moved from \`${baseline}\` to \`${current}\`.\n\n` +
                    `These cherry-picked PRs appear to have landed upstream — consider retiring:\n\n` +
                    `${retired.split(' ').filter(Boolean).map(p => `- ${p}`).join('\n')}\n\n` +
                    `Next steps:\n` +
                    `1. Verify upstream merge commits actually include the same diff\n` +
                    `2. Update \`UPSTREAM_DIFF.md\` retire column\n` +
                    `3. Remove our cherry-pick commits and rebase onto new upstream\n` +
                    `4. Bump major version (MAJOR = upstream tracking indicator)\n`,
              labels: ['upstream-sync', 'automated']
            });

      - name: Upload diff log
        if: steps.diff.outputs.drift == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: upstream-diff-log
          path: upstream-diff.log
          retention-days: 30
